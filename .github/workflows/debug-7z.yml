name: debug-7z
on: workflow_dispatch
jobs:
  probe:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - name: 探针：runner 的 7z 版本与 AES zip 名字编码
        shell: pwsh
        env:
          PYTHONIOENCODING: utf-8
        run: |
          $ErrorActionPreference = 'Stop'
          & 'C:\Program Files\7-Zip\7z.exe' | Select-Object -First 3
          $code = @'
          import ctypes, io, os, sys, zipfile
          print("ACP =", ctypes.windll.kernel32.GetACP())
          sys.path.insert(0, "tests")
          import gen_release_corpus as g
          os.makedirs("tests/work/_diag", exist_ok=True)
          files = {"emoji/\U0001F3AC\u7D20\u6750.dat": b"x" * 100,
                   "\u6df1\u5ea6\u76ee\u5f55/\u957f\u8def\u5f84/\u6570\u636e\u6587\u4ef6.bin": b"y" * 100}
          aes = g._aes_zip(files, "Pw@1", "tests/work/_diag")
          open("tests/work/_diag/aes.zip", "wb").write(aes)
          zf = zipfile.ZipFile(io.BytesIO(aes))
          for i in zf.infolist():
              print("entry flags=%#x efs=%s name=%r" % (i.flag_bits, bool(i.flag_bits & 0x800), i.filename))
          k = aes.find(b"PK\x01\x02")
          print("first CD raw:", aes[k:k+140])
          print("7z extra 0x9901 present:", aes.find(bytes.fromhex("9901")) != -1)
          '@
          python -c $code
          7z l -slt tests\work\_diag\aes.zip | Select-String "Path|Flags|Method" | Select-Object -First 8
