# release.yml — tag 触发的发布构建 + 完整验证门
#
# 触发：推送 v* 标签（或手动 workflow_dispatch 试跑，不发布仅出 artifact）。
# 产物：nx-<tag>-windows-x64.zip（nx.exe + 7z.dll(视环境) + 文档）→ GitHub Release。
#
# 验证语义：发布前在 CI 上跑**与本地相同的门体系**（run_tests 全量 + release_gate）。
# CI 安装缺失工具链：Java(TLC) / tla2tools.jar / LLVM(clang-cl+clang-tidy，若 VS
# 组件缺席) / 闭包内核（仓库自含 krml_runtime 收编，无需本地 F*）。
# 已知缺口：rar4/旧命名卷无语料生成渠道（WinRAR 7.x 已不支持 -ma4，README 已知
# 限制 #3）。rar 族用例经 LFS 冻结语料（tests/cases-rar）在 CI 全量运行，零跳过。
# 便携包不含 nxshell.dll/menupkg（Win11 新版菜单雏形未启用，在用的是经典菜单）。

name: release

on:
  push:
    tags: ['v*']
  workflow_dispatch:

permissions:
  contents: write

env:
  VCPKG_DEFAULT_BINARY_CACHE: ${{ github.workspace }}\vcpkg-bincache
  # runner 的 Python stdio 默认 cp1252——中文消息直接 UnicodeEncodeError
  PYTHONIOENCODING: utf-8

jobs:
  build-and-release:
    runs-on: windows-latest
    timeout-minutes: 150
    steps:
      - name: 检出（含 LFS：rar 冻结语料）
        uses: actions/checkout@v4
        with:
          lfs: true

      - name: Python 3.14（语料确定性：zipfile 所链 zlib 的 deflate 流随版本漂移）
        uses: actions/setup-python@v5
        with:
          python-version: '3.14'

      - name: vcpkg 二进制缓存
        uses: actions/cache@v4
        with:
          path: vcpkg-bincache
          key: vcpkg-bin-${{ hashFiles('vcpkg.json', 'ports-overlay/**') }}
          restore-keys: vcpkg-bin-

      - name: Java（TLA+ TLC 运行时）
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'

      - name: LLVM 兜底（VS Clang 组件缺席时）
        shell: pwsh
        run: |
          $vs = & "${env:ProgramFiles(x86)}\Microsoft Visual Studio\Installer\vswhere.exe" `
            -latest -products * -property installationPath
          $cands = @(
            (Join-Path $vs 'VC\Tools\Llvm\x64\bin\clang-tidy.exe'),
            "$env:ProgramFiles\LLVM\bin\clang-tidy.exe"
          ) | Where-Object { $_ -and (Test-Path $_) }
          if (-not $cands) {
            Write-Host '[tools] VS Clang 组件与独立 LLVM 均缺席 → choco install llvm'
            choco install -y --no-progress llvm
            if ($LASTEXITCODE -ne 0) { throw 'choco install llvm 失败' }
          } else {
            Write-Host "[tools] clang 工具链就绪: $($cands[0])"
          }

      - name: 引导 vcpkg（独立克隆）
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          $vcpkg = Join-Path $env:RUNNER_TEMP 'vcpkg'
          # 钉扎到 vcpkg.json 的 builtin-baseline 提交（可复现 + 浅取提速）；
          # baseline 解析要求该 commit 可达——checkout 的正是它
          git init $vcpkg
          if ($LASTEXITCODE -ne 0) { throw 'git init vcpkg 失败' }
          git -C $vcpkg remote add origin https://github.com/microsoft/vcpkg.git
          git -C $vcpkg fetch --depth 1 origin e03dc9b29710050cd1018bc5674688108658d327
          if ($LASTEXITCODE -ne 0) { throw 'fetch vcpkg baseline 失败' }
          git -C $vcpkg checkout FETCH_HEAD
          if ($LASTEXITCODE -ne 0) { throw 'checkout vcpkg baseline 失败' }
          & (Join-Path $vcpkg 'bootstrap-vcpkg.bat') -disableMetrics
          if ($LASTEXITCODE -ne 0) { throw 'bootstrap-vcpkg 失败' }
          "VCPKG_ROOT=$vcpkg" >> $env:GITHUB_ENV
          New-Item -ItemType Directory -Force -Path $env:VCPKG_DEFAULT_BINARY_CACHE | Out-Null

      - name: TLA+ TLC（tla2tools v1.8.0）
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          curl -sS -L -o tools/tla2tools.jar `
            https://github.com/tlaplus/tlaplus/releases/download/v1.8.0/tla2tools.jar
          if ($LASTEXITCODE -ne 0) { throw 'tla2tools 下载失败' }
          # 有效性交给 run_tests 的 TLA 门（跑真模型）；此处仅 JVM 与文件体检
          #（TLC -h 以非零码退出，不能用作校验）
          java -version
          if ($LASTEXITCODE -ne 0) { throw 'java 不可用' }
          if ((Get-Item tools/tla2tools.jar).Length -lt 1MB) { throw 'tla2tools.jar 异常（<1MB）' }

      - name: 配置 + 构建（MSVC/Ninja/静态 CRT）
        shell: cmd
        run: |
          for /f "usebackq tokens=*" %%i in (`"%ProgramFiles(x86)%\Microsoft Visual Studio\Installer\vswhere.exe" -latest -products * -requires Microsoft.VisualStudio.Component.VC.Tools.x86.x64 -property installationPath`) do set "VSPATH=%%i"
          if not defined VSPATH exit /b 1
          call "%VSPATH%\VC\Auxiliary\Build\vcvars64.bat" || exit /b 1
          cmake -S . -B build -G Ninja -DCMAKE_BUILD_TYPE=Release ^
            "-DCMAKE_TOOLCHAIN_FILE=%VCPKG_ROOT%\scripts\buildsystems\vcpkg.cmake" ^
            -DVCPKG_TARGET_TRIPLET=x64-windows-static ^
            "-DVCPKG_INSTALL_OPTIONS=--overlay-ports=%GITHUB_WORKSPACE%/ports-overlay" || exit /b 1
          cmake --build build || exit /b 1

      - name: 闭包内核（仓库自含 KaRaMeL 运行时）
        shell: cmd
        run: tools\build_closure_kernel.cmd || exit /b 1

      - name: 7-Zip 版本观测（语料生成与 7z.dll 随包均用 runner 自带版）
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          # 不钉版本：2026-10-05 调查证伪"7-Zip 26 AES zip 不兼容"（真因是
          # regionOf 缺自证，bbdea4c 已修），且发布门比对输出哈希、与语料由
          # 哪个 7z 生成无关（26.03 语料对冻结 manifest 全绿实测）。版本随
          # runner 漂移在此打印留痕，便于未来诊断对齐。
          $sz = 'C:\Program Files\7-Zip\7z.exe'
          if (-not (Test-Path $sz)) { throw 'runner 缺 7-Zip（语料生成与 7z.dll 随包都依赖它）' }
          $ver = (& $sz | Select-Object -First 2 | Out-String)
          Write-Host $ver

      - name: 生成测试语料
        shell: cmd
        run: |
          python tests\gen_corpus_m1.py || exit /b 1
          python tests\gen_corpus.py || exit /b 1
          python tests\gen_corpus_fn.py || exit /b 1
          python tests\gen_corpus_m2.py || exit /b 1
          python tests\gen_release_corpus.py || exit /b 1
          rem m1 先跑：gen_corpus 的 stego_mp4_7z/rar 复用 m1 语料（全新 checkout
          rem 无累积，顺序与本地文档相反）；m1 自跳过 WinRAR 依赖的 rar 用例
          rem （Rar.exe 专有仅本地），其 7z/zip 用例正常生成
          rem rar 族用例：LFS 冻结语料补入（生成器无法在 CI 产 rar；读取引擎无关）
          rem robocopy 退出码 0-7 均为成功（1=有复制 2=有重复 3=两者），>=8 才失败
          robocopy tests\cases-rar tests\cases /E /XF SHA256SUMS >nul
          if %ERRORLEVEL% GEQ 8 exit /b 1
          exit /b 0

      - name: 全量测试门（run_tests：单元+属性+所有权双门+tidy+GUI 冒烟）
        shell: cmd
        run: python tests\run_tests.py || exit /b 1

      - name: 发布门（合成语料端到端哈希比对）
        shell: cmd
        run: python tests\release_gate.py || exit /b 1

      - name: 门失败现场回收（本地复现二分用）
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: gate-failure-cases
          path: tests/release-cases/

      - name: 组装便携包 dist\nx
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          $out = 'dist/nx'
          New-Item -ItemType Directory -Force -Path $out | Out-Null
          Copy-Item build/nx.exe $out
          Copy-Item README.md $out
          Copy-Item LICENSE $out
          Copy-Item LICENSE-distro.txt (Join-Path $out 'LICENSE.txt')
          # 7z.dll 可选：runner 装有 7-Zip 则随包（缺失回退 libarchive，主体功能不受影响）
          if (Test-Path 'C:\Program Files\7-Zip\7z.dll') {
            Copy-Item 'C:\Program Files\7-Zip\7z.dll' $out
            Write-Host '[dist] 7z.dll 已随包'
          } else {
            Write-Host '[dist] WARN: runner 无 7-Zip，7z.dll 不随包（可选组件）'
          }
          Get-ChildItem $out | Select-Object Name, Length | Format-Table -AutoSize

      - name: 打 zip + 生成发布说明
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          $name = if ($env:GITHUB_EVENT_NAME -eq 'push') { $env:GITHUB_REF_NAME }
                  else { $env:GITHUB_SHA.Substring(0, 7) }
          $zip = "nx-$name-windows-x64.zip"
          Compress-Archive -Path dist/nx/* -DestinationPath $zip
          $hash = (Get-FileHash $zip -Algorithm SHA256).Hash
          "ZIP_PATH=$zip" >> $env:GITHUB_ENV
          $notes = @'
          nx __NAME__ 便携版（Windows x64）

          ## 内容
          - nx.exe —— 单文件解压器（MIT 许可，详见包内 LICENSE 与 LICENSE.txt）
          - 7z.dll —— 可选；本包若未包含：放一个 7z.dll 到 nx.exe 同目录即可启用 7z 全特性与 RAR。缺失时自动回退内置引擎（RAR 原生多卷除外）

          ## 使用
          解压到任意目录。右键菜单：在 nx.exe 所在目录运行 nx menu install（当前用户，免管理员，经典级联菜单）。
          命令行示例：nx extract data.zip.001 -O out\ （嵌套/加密/分片全自动；nx --help 看全部选项）。

          SHA-256: __SHA256__
          '@
          $notes.Replace('__NAME__', $name).Replace('__SHA256__', $hash) |
            Set-Content -Encoding UTF8 release-notes.md

      - name: 上传构建产物（含手动试跑）
        uses: actions/upload-artifact@v4
        with:
          name: nx-windows-x64
          path: nx-*-windows-x64.zip

      - name: 创建 GitHub Release（仅 tag）
        if: github.event_name == 'push'
        shell: pwsh
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release create $env:GITHUB_REF_NAME $env:ZIP_PATH `
            --title "nx $env:GITHUB_REF_NAME" --notes-file release-notes.md
